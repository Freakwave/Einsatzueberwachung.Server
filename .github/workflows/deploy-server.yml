name: Deploy Server

on:
  push:
    branches: [deploy]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore tests
        run: dotnet restore src/Einsatzueberwachung.Tests/Einsatzueberwachung.Tests.csproj

      - name: Build tests
        run: dotnet build src/Einsatzueberwachung.Tests/Einsatzueberwachung.Tests.csproj -c Release --no-restore

      - name: Run tests
        run: dotnet test src/Einsatzueberwachung.Tests/Einsatzueberwachung.Tests.csproj -c Release --no-build

      - name: Publish server
        run: dotnet publish src/Einsatzueberwachung.Server -c Release -r linux-x64 --self-contained false -o artifacts/publish

      - name: Ensure libSkiaSharp.so in publish output
        shell: bash
        run: |
          PUBLISH_DIR="artifacts/publish"
          SKIA_VERSION="3.116.1"

          if [[ -f "$PUBLISH_DIR/libSkiaSharp.so" || -f "$PUBLISH_DIR/runtimes/linux-x64/native/libSkiaSharp.so" ]]; then
            exit 0
          fi

          SKIA_SO=$(find "$HOME/.nuget" /usr/share/dotnet -name "libSkiaSharp.so" 2>/dev/null | grep -E "/linux-x64/native/" | sort -V | tail -1 || true)

          if [[ -z "$SKIA_SO" ]]; then
            curl -fsSLo /tmp/skia.nupkg "https://www.nuget.org/api/v2/package/SkiaSharp.NativeAssets.Linux/$SKIA_VERSION"
            mkdir -p /tmp/skia-pkg
            unzip -oq /tmp/skia.nupkg -d /tmp/skia-pkg
            SKIA_SO="/tmp/skia-pkg/runtimes/linux-x64/native/libSkiaSharp.so"
          fi

          if [[ ! -f "$SKIA_SO" ]]; then
            echo "::error::libSkiaSharp.so could not be located"
            exit 1
          fi

          cp "$SKIA_SO" "$PUBLISH_DIR/libSkiaSharp.so"

      - name: Package server
        run: |
          mkdir -p artifacts
          cd artifacts/publish
          zip -qr ../einsatzueberwachung-server.zip .

      - name: Deploy over SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::GitHub variable or secret $name is not configured"
              exit 1
            fi
          done

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/deploy_key"' EXIT

          SSH_OPTIONS=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"
          PACKAGE_NAME="einsatzueberwachung-${GITHUB_SHA}.zip"
          REMOTE_PACKAGE="/tmp/${PACKAGE_NAME}"

          scp "${SSH_OPTIONS[@]}" "artifacts/einsatzueberwachung-server.zip" "$TARGET:$REMOTE_PACKAGE"
          ssh "${SSH_OPTIONS[@]}" "$TARGET" \
            "sudo -n /opt/einsatzueberwachung/scripts/apply-update.sh '$REMOTE_PACKAGE' '$GITHUB_SHA'; result=\$?; rm -f '$REMOTE_PACKAGE'; exit \$result"
